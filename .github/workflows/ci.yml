name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: 'true'

jobs:
  # Clippy and the full test suite (unit, property, golden files) on every
  # native platform, under the pinned stable, beta and nightly.
  test:
    name: test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.toolchain == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04 # Linux x86_64
          - ubuntu-24.04-arm # Linux aarch64 (Raspberry Pi 3/4/5, 64-bit OS)
          - macos-latest # macOS aarch64
          - macos-15-intel # macOS x86_64
          - windows-latest # Windows x86_64
          - windows-11-arm # Windows aarch64
        toolchain: ['1.100.0', beta, nightly]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal \
            --component clippy
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Lint
        shell: bash
        run: make lint
      - name: Test
        shell: bash
        run: make test

  # 32-bit and other architectures: cross-compiled, tests run under QEMU
  # (Linux) or natively (32-bit x86).
  #
  # Every apt package is pinned to an exact version of the runner's Ubuntu
  # release (26.04, hence no ubuntu-latest anywhere). Ubuntu drops a version
  # from the archive once an update supersedes it, so a pin then fails loudly
  # and has to be bumped: read the new version with
  # `apt-cache policy <package>` on the runner, or from the failing log.
  cross:
    name: cross (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Raspberry Pi 2/3/4 with a 32-bit OS (ARMv7).
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-26.04
            apt: >-
              gcc-arm-linux-gnueabihf=4:15.2.0-5ubuntu1
              libc6-dev-armhf-cross=2.43-2ubuntu2cross1
            linker: arm-linux-gnueabihf-gcc
            sysroot: /usr/arm-linux-gnueabihf
          # Raspberry Pi Zero/1 (ARMv6). Linked against Ubuntu's armhf libc,
          # so this checks code generation and the test suite, not
          # Raspberry Pi OS's ARMv6 userland.
          - target: arm-unknown-linux-gnueabihf
            os: ubuntu-26.04
            apt: >-
              gcc-arm-linux-gnueabihf=4:15.2.0-5ubuntu1
              libc6-dev-armhf-cross=2.43-2ubuntu2cross1
            linker: arm-linux-gnueabihf-gcc
            sysroot: /usr/arm-linux-gnueabihf
          - target: riscv64gc-unknown-linux-gnu
            os: ubuntu-26.04
            apt: >-
              gcc-riscv64-linux-gnu=4:15.2.0-5ubuntu1
              libc6-dev-riscv64-cross=2.43-2ubuntu2cross1
            linker: riscv64-linux-gnu-gcc
            sysroot: /usr/riscv64-linux-gnu
          - target: i686-unknown-linux-gnu
            os: ubuntu-26.04
            apt: gcc-multilib=4:15.2.0-5ubuntu1
          - target: i686-pc-windows-msvc
            os: windows-latest
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Install Rust
        shell: bash
        run: rustup target add "$CARGO_BUILD_TARGET"
      - name: Install cross toolchain and QEMU
        if: matrix.apt
        env:
          APT: ${{ matrix.apt }}
          LINKER: ${{ matrix.linker }}
          SYSROOT: ${{ matrix.sysroot }}
          QEMU_VERSION: 1:10.2.1+ds-1ubuntu3.3
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # APT is a package list
          sudo apt-get install -y --no-install-recommends $APT
          if [ -n "$LINKER" ]; then
            # qemu-user-binfmt registers QEMU with binfmt_misc
            # (qemu-user-static is gone from recent Ubuntu releases).
            sudo apt-get install -y --no-install-recommends \
              "qemu-user=$QEMU_VERSION" "qemu-user-binfmt=$QEMU_VERSION"
            var=$(echo "$CARGO_BUILD_TARGET" | tr 'a-z-' 'A-Z_')
            echo "CARGO_TARGET_${var}_LINKER=$LINKER" >> "$GITHUB_ENV"
            # binfmt_misc runs foreign binaries through QEMU, including the
            # baldssl binary the golden tests spawn; QEMU_LD_PREFIX points
            # it at the target's dynamic loader and libc.
            echo "QEMU_LD_PREFIX=$SYSROOT" >> "$GITHUB_ENV"
          fi
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Test
        shell: bash
        run: make test

  # os_rng on every libc and OS version it supports. The versions come from
  # website/src/platforms.json, which the website's Platforms table also
  # reads: to test a new version, add it there. The minimum versions are
  # documented, with their sources, in crates/baldssl-crypto/src/os_rng.rs.
  # No sccache here: the builds are small and some run inside containers.
  platforms:
    runs-on: ubuntu-26.04
    outputs:
      glibc: ${{ steps.matrix.outputs.glibc }}
      musl: ${{ steps.matrix.outputs.musl }}
      android: ${{ steps.matrix.outputs.android }}
      runners: ${{ steps.matrix.outputs.runners }}
      bsd: ${{ steps.matrix.outputs.bsd }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: matrix
        run: make -s platform-matrix >> "$GITHUB_OUTPUT"

  # glibc: built and run inside each distribution with its own C toolchain.
  # The version below the minimum (glibc 2.24, before getrandom appeared in
  # 2.25) must fail to link: this pins the documented minimum.
  os-rng-glibc:
    name: os-rng (${{ matrix.name }}, ${{ matrix.libc }})
    needs: platforms
    runs-on: ubuntu-26.04
    env:
      RUSTC_WRAPPER: ''
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.platforms.outputs.glibc) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Test os_rng
        env:
          IMAGE: ${{ matrix.image }}
          EXPECT: ${{ matrix.expect }}
        run: make test-os-rng-glibc IMAGE="$IMAGE" EXPECT="$EXPECT"

  # musl, statically linked against the musl that Rust bundles.
  os-rng-musl:
    name: os-rng (musl, ${{ matrix.target }})
    needs: platforms
    runs-on: ${{ matrix.runner }}
    env:
      RUSTC_WRAPPER: ''
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.platforms.outputs.musl) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Test os_rng
        env:
          TARGET: ${{ matrix.target }}
        run: make test-os-rng-musl MUSL_TARGET="$TARGET"

  # Android: its libc, bionic, has getrandom from API level 28 (Android 9).
  # Linking against API level 27 (Android 8.1) must fail; a build for API
  # level 28 runs on the minimum and on a recent level.
  os-rng-android:
    name: os-rng (${{ matrix.name }}, ${{ matrix.mode }})
    needs: platforms
    runs-on: ubuntu-26.04
    # A hung emulator must not hold a runner for the 6-hour default.
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: ''
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.platforms.outputs.android) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Enable KVM for the emulator
        if: matrix.mode == 'run'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test os_rng
        env:
          MODE: ${{ matrix.mode }}
          API: ${{ matrix.api }}
          RUN_API: ${{ matrix.run_api }}
        run: >
          make test-os-rng-android ANDROID_MODE="$MODE" ANDROID_API="$API"
          ANDROID_RUN_API="$RUN_API"

  # Every macOS and Windows runner version, both architectures.
  os-rng-platforms:
    name: os-rng (${{ matrix.name }})
    needs: platforms
    runs-on: ${{ matrix.runner }}
    env:
      RUSTC_WRAPPER: ''
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.platforms.outputs.runners) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y
      - name: Test os_rng
        shell: bash
        run: make test-os-rng

  # The BSDs, in virtual machines (vmactions, pinned by commit). Each uses
  # the Rust its own packages provide, which may trail the pinned toolchain:
  # rust-version is ignored there, and the version used is printed. FreeBSD
  # and NetBSD are tier-2 targets; OpenBSD and DragonFly are tier 3, built
  # by their own packaged compilers.
  os-rng-bsd:
    name: os-rng (${{ matrix.name }})
    needs: platforms
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.platforms.outputs.bsd) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test os_rng on FreeBSD
        if: matrix.os == 'freebsd'
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          release: ${{ matrix.release }}
          copyback: false
          prepare: pkg install -y rust gmake
          run: gmake test-os-rng-system-rust
      - name: Test os_rng on NetBSD
        if: matrix.os == 'netbsd'
        uses: vmactions/netbsd-vm@5957cf330aef2e6ddc63c604364c99ce2e02b91d # v1.5.3
        with:
          release: ${{ matrix.release }}
          copyback: false
          prepare: /usr/sbin/pkg_add -u rust gmake
          run: gmake test-os-rng-system-rust
      - name: Test os_rng on OpenBSD
        if: matrix.os == 'openbsd'
        uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3 # v1.4.9
        with:
          release: ${{ matrix.release }}
          copyback: false
          prepare: pkg_add rust gmake
          run: gmake test-os-rng-system-rust
      - name: Test os_rng on DragonFly BSD
        if: matrix.os == 'dragonflybsd'
        uses: vmactions/dragonflybsd-vm@84881684c8771163f1dd37820a358aa3cd8bc2f2 # v1.3.5
        with:
          release: ${{ matrix.release }}
          copyback: false
          prepare: pkg install -y rust gmake
          run: gmake test-os-rng-system-rust

  # WebAssembly: the libraries build for the browser target, and the CLI,
  # built for WASI, passes the same golden suite as the native binary.
  wasm:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: wasmtime@51.0.0
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - run: make test-wasm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baldssl-wasm32-wasip1
          path: target/wasm32-wasip1/release/baldssl.wasm

  format:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly rustfmt
        run:
          rustup toolchain install nightly --profile minimal --component rustfmt
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: taplo-cli@0.9.3
      - run: make check-format

  # Zero-dependency policy, docs, the `--cfg aeneas` build, shell scripts.
  hygiene:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - run: make check-no-deps
      - run: make check-unsafe
      - run: make check-where-clauses
      - run: make check-use-at-top
      - run: make check-opt-suffix
      - run: make check-practices
      - run: make doc
      - run: make doc-private
      - run: make check-aeneas
      - run: make lint-shell

  # The Python scripts: formatted, linted, type-checked (strict) and tested,
  # with the tools pinned in uv.lock.
  python:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: make check-py

  # Every URL in the sources and in the rendered Rust documentation must be
  # reachable, and every #fragment must name an element of its page.
  links:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - run: make check-urls

  coverage:
    runs-on: ubuntu-26.04
    env:
      # Instrumented builds are not cached; do not route them through sccache.
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-tarpaulin
      - run: make coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: target/coverage/

  # Differential tests against real OpenSSL builds, both directions (see
  # scripts/interop.sh). Every listed release must pass; 3.0 runs with the
  # 3.0 compatibility profile.
  interop:
    name: interop (OpenSSL ${{ matrix.version }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 3.5.9
            sha256: 603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a
          - version: 4.1.0
            sha256: 50c17baf54cb008f6ce42d50deb4b28050a1aad711636cabd4b241c7e90cc2fd
          - version: 3.0.22
            sha256: 67ebca7e50d17383028045486653492195b83db95f8558709701bb47b5c1ef81
          - version: 3.6.5
            sha256: a2157c2830efdec3788939b00c9b0638306d3f0bbb76dc4832ee503bb397df98
          - version: 4.0.3
            sha256: 325b5c806167c13b40b1ffeadfe0248197c00eccc4cf123ec1e28d2d2fd216d9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - id: openssl
        uses: ./.github/actions/build-openssl
        with:
          version: ${{ matrix.version }}
          sha256: ${{ matrix.sha256 }}
      - name: Interop
        env:
          OPENSSL: ${{ steps.openssl.outputs.openssl }}
        run: make interop OPENSSL="$OPENSSL"

  # Every command on the website, run as a reader would paste it: against
  # OpenSSL, and against baldssl where the website says it is supported.
  website-examples:
    name: website examples (OpenSSL ${{ matrix.version }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 3.5.9
            sha256: 603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a
            install: '1'
          - version: 4.1.0
            sha256: 50c17baf54cb008f6ce42d50deb4b28050a1aad711636cabd4b241c7e90cc2fd
            install: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - id: openssl
        uses: ./.github/actions/build-openssl
        with:
          version: ${{ matrix.version }}
          sha256: ${{ matrix.sha256 }}
      - name: Run the website's commands
        env:
          OPENSSL: ${{ steps.openssl.outputs.openssl }}
          INSTALL: ${{ matrix.install }}
        run: make website-examples OPENSSL="$OPENSSL" INSTALL="$INSTALL"

  # The committed golden files must be exactly what the supported OpenSSL
  # releases print today.
  golden:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v30
        uses: ./.github/actions/build-openssl
        with:
          version: 3.0.22
          sha256: 67ebca7e50d17383028045486653492195b83db95f8558709701bb47b5c1ef81
      - id: v3
        uses: ./.github/actions/build-openssl
        with:
          version: 3.5.9
          sha256: 603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a
      - id: v4
        uses: ./.github/actions/build-openssl
        with:
          version: 4.1.0
          sha256: 50c17baf54cb008f6ce42d50deb4b28050a1aad711636cabd4b241c7e90cc2fd
      - name: Regenerate and compare
        env:
          OPENSSL_30: ${{ steps.v30.outputs.openssl }}
          OPENSSL_3: ${{ steps.v3.outputs.openssl }}
          OPENSSL_4: ${{ steps.v4.outputs.openssl }}
        run: |
          make check-golden OPENSSL_30="$OPENSSL_30" OPENSSL_3="$OPENSSL_3" \
            OPENSSL_4="$OPENSSL_4"

  # The Lean 4 skeleton must keep building against the pinned Aeneas.
  lean:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          lake-package-directory: proofs
          auto-config: false
          use-mathlib-cache: false
      - run: make lean
