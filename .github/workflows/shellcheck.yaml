name: Shellcheck

# Only when a shell script, or what runs shellcheck, changes.
on:
  push:
    branches: [main]
    paths:
      - '**.sh'
      - Makefile
      - .github/workflows/shellcheck.yaml
  pull_request:
    paths:
      - '**.sh'
      - Makefile
      - .github/workflows/shellcheck.yaml

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make lint-shell
