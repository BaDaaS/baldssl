# Coverage-guided fuzzing (cargo-fuzz, nightly). Outside the main workspace so
# that libfuzzer-sys never enters the shipped dependency graph.
[package]
name = "baldssl-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
baldssl-core = { path = "../crates/baldssl-core" }
baldssl-x509 = { path = "../crates/baldssl-x509" }
libfuzzer-sys = "0.4.13"

[workspace]

[[bin]]
name = "base64"
path = "fuzz_targets/base64.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pem"
path = "fuzz_targets/pem.rs"
test = false
doc = false
bench = false

[[bin]]
name = "der"
path = "fuzz_targets/der.rs"
test = false
doc = false
bench = false

[[bin]]
name = "x509"
path = "fuzz_targets/x509.rs"
test = false
doc = false
bench = false
