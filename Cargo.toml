[workspace]
resolver = "3"
# fuzz/ needs nightly and its own lockfile; proofs/ is a Lean project.
exclude = ["fuzz", "proofs"]
members = [
  "crates/baldssl",
  "crates/baldssl-core",
  "crates/baldssl-crypto",
  "crates/baldssl-pkey",
  "crates/baldssl-test-utils",
  "crates/baldssl-x509",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/BaDaaS/baldssl"

# Zero third-party dependencies, by design: every primitive (base64, PEM, DER,
# SHA-1, SHA-2, argument parsing) lives in this repository so that it can be
# audited and, incrementally, verified in Lean 4 through Aeneas.
[workspace.dependencies]
baldssl-core = { path = "crates/baldssl-core", version = "0.1.0" }
baldssl-crypto = { path = "crates/baldssl-crypto", version = "0.1.0" }
baldssl-pkey = { path = "crates/baldssl-pkey", version = "0.1.0" }
baldssl-test-utils = { path = "crates/baldssl-test-utils" }
baldssl-x509 = { path = "crates/baldssl-x509", version = "0.1.0" }

# Test-only. `make check-no-deps` asserts no third-party crate reaches a
# normal or build dependency edge.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
# Allowed in one module only, baldssl-crypto::os_rng (`make check-unsafe`).
unsafe_code = "deny"
missing_docs = "warn"
# A `pub` item must be reachable from the crate root, so that the public API
# is exactly what is re-exported on purpose; everything else is pub(crate).
unreachable_pub = "warn"
# `--cfg aeneas` is passed when extracting to Lean with Charon; it compiles
# out the parts Aeneas cannot translate (std::io, Display, std::error::Error).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(aeneas)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# Prose names ASN.1 types (UTCTime, BOOLEAN) and specs constantly.
doc_markdown = "allow"
# Suggests the `bytecount` crate; the project takes no dependencies.
naive_bytecount = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
