# The latest stable release. CI also runs beta and nightly by overriding
# this file with RUSTUP_TOOLCHAIN.
[toolchain]
channel = "1.100.0"
components = ["rustfmt", "clippy"]
# WebAssembly: the libraries for the browser, the CLI under WASI. WASI
# preview 1, because preview 2 collapses every non-zero exit code to 1 and
# baldssl exits with 2 for a missing input file.
targets = ["wasm32-unknown-unknown", "wasm32-wasip1"]
