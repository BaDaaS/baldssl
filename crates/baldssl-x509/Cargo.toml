[package]
name = "baldssl-x509"
description = "X.509 certificate parsing and OpenSSL-compatible printing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
baldssl-core.workspace = true
baldssl-crypto.workspace = true
baldssl-pkey.workspace = true

[features]
default = ["openssl-3-0", "openssl-3-5", "openssl-3-6", "openssl-4"]
# The OpenSSL release lines compiled in (see the profile module).
openssl-3-0 = []
openssl-3-5 = []
openssl-3-6 = []
openssl-4 = []

[dev-dependencies]
baldssl-core = { workspace = true, features = ["laws"] }
baldssl-test-utils = { workspace = true, features = ["proptest"] }
proptest.workspace = true

[lints]
workspace = true
