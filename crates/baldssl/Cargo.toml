[package]
name = "baldssl"
description = "A Rust reimplementation of the OpenSSL command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "baldssl"
path = "src/main.rs"

[dependencies]
baldssl-core.workspace = true
baldssl-crypto.workspace = true
baldssl-fs.workspace = true
baldssl-pkey.workspace = true
baldssl-x509.workspace = true

[features]
default = ["openssl-3-5"]
# The OpenSSL release line baldssl imitates: exactly one (see src/line.rs).
openssl-3-0 = ["baldssl-x509/openssl-3-0"]
openssl-3-5 = ["baldssl-x509/openssl-3-5"]
openssl-3-6 = ["baldssl-x509/openssl-3-6"]
openssl-4 = ["baldssl-x509/openssl-4"]

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
